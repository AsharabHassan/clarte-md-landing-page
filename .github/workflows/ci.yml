name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

      - name: Unit tests (no DB required)
        run: npx vitest run tests/unit
        env:
          IP_HASH_PEPPER: 'ci-test-pepper'

      - name: Build
        run: npm run build
        env:
          # Stub values — sufficient for `next build` static analysis.
          # Real values are provided in Vercel project env at deploy time.
          NEXT_PUBLIC_SUPABASE_URL: 'https://stub.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'stub'
          SUPABASE_SERVICE_ROLE_KEY: 'stub'
          DATABASE_URL: 'postgres://stub:stub@stub:5432/stub'
          GEMINI_API_KEY: 'stub'
          IP_HASH_PEPPER: 'ci-test-pepper'
          CRON_SECRET: 'stub'
          NEXT_PUBLIC_GTM_ID: 'GTM-CI'
